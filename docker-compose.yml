version: "3.9"

# Enterprise Reporting System - Docker Compose for Hostinger VPS
# This setup uses bind mounts for data persistence (Hostinger best practice)
# All data is stored on the VPS filesystem at /srv/enterprise-reporting-system/
# SQLite-only configuration (no PostgreSQL)

services:
  # Redis (for BullMQ job queue)
  redis:
    image: redis:7-alpine
    container_name: ers-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      # Bind mount: VPS path → Container path
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/redis/data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ers-network

  # Main Application
  app:
    image: enterprise-reporting-system:latest
    container_name: ers-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Application
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      PORT: 3000

      # Authentication
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}

      # SQLite Configuration Database
      DATABASE_PATH: /app/data/config.sqlite

      # Redis (Job Queue)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Job Processing
      JOB_OUTPUT_PATH: /app/job-outputs
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}

      # Error Reporting
      NEXT_PUBLIC_ERROR_REPORTING_EMAIL: ${NEXT_PUBLIC_ERROR_REPORTING_EMAIL:-admin@yourcompany.com}

      # Server-Side Pagination
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-50}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-1000}
      DATA_TABLE_PAGE_SIZE: ${DATA_TABLE_PAGE_SIZE:-100}
      EXPORT_PAGE_SIZE: ${EXPORT_PAGE_SIZE:-1000}
      VIRTUAL_SCROLL_THRESHOLD: ${VIRTUAL_SCROLL_THRESHOLD:-500}
      ENABLE_VIRTUAL_SCROLLING: ${ENABLE_VIRTUAL_SCROLLING:-true}
    volumes:
      # Bind mounts: VPS paths → Container paths
      # Configuration database (SQLite)
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/app/data:/app/data
      # Job outputs (exported reports, charts, etc.)
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/app/job-outputs:/app/job-outputs
      # Uploads (user uploaded files, test databases)
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/app/uploads:/app/uploads
      # Logs
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/app/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ers-network

networks:
  ers-network:
    driver: bridge
